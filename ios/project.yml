# The Xcode project is made from this file by XcodeGen (see .github/workflows/ios.yml).
name: Bureau
options:
  bundleIdPrefix: com.matisseduffield
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Bureau:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shell
      # The page as the iPhone app has it: web/ without the parts that only the
      # website and the Android app use. Made by `node scripts/ios-bundle.mjs`,
      # which has to run before XcodeGen (the folder is not in git).
      - path: bundle/web
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bureau
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Page
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matisseduffield.bureau
        # iPhone only. XcodeGen adds iPad to each target unless told here.
        TARGETED_DEVICE_FAMILY: "1"
