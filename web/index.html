<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8ECE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<title>Bureau</title>
<style>
/* Hanken Grotesk ships with the page (fonts/, SIL OFL) so the app looks the same offline. */
@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/hanken-grotesk-latin.woff2") format("woff2");
  font-weight: 400 600;
  font-display: swap;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/hanken-grotesk-latin-ext.woff2") format("woff2");
  font-weight: 400 600;
  font-display: swap;
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

/* Layout: one narrow working column. The conversion slip on top, then the trend, then quick amounts. */
:root {
  --bg: #E8ECE5;
  --surface: #F7F8F4;
  --ink: #14211C;
  --muted: #5B6861;
  --faint: #8D9992;
  --line: #CDD5CC;
  --accent: #2C53C4;
  --accent-soft: rgba(44, 83, 196, .08);
  --accent-ink: #FFFFFF;
  --up: #1D7548;
  --down: #B0392D;
  --warn: #8F5D08;
  --backdrop: rgba(10, 16, 14, .4);
  --font: "Hanken Grotesk", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412;
    --surface: #18211E;
    --ink: #E4EAE5;
    --muted: #8C9992;
    --faint: #5F6C66;
    --line: #2E3A35;
    --accent: #85A2FF;
    --accent-soft: rgba(133, 162, 255, .10);
    --accent-ink: #0E1412;
    --up: #5FC890;
    --down: #F08476;
    --warn: #E0AA48;
    --backdrop: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412;
  --surface: #18211E;
  --ink: #E4EAE5;
  --muted: #8C9992;
  --faint: #5F6C66;
  --line: #2E3A35;
  --accent: #85A2FF;
  --accent-soft: rgba(133, 162, 255, .10);
  --accent-ink: #0E1412;
  --up: #5FC890;
  --down: #F08476;
  --warn: #E0AA48;
  --backdrop: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: -8px; }
.brand { display: grid; justify-items: start; }
.mark { margin: 0; font-size: 1.2rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
/* Rates freshness under the name; tap to refresh */
.status {
  min-height: 28px; margin: -2px 0 0 -6px; padding: 0 6px;
  background: none; border: 0;
  font-size: .8rem; color: var(--muted);
}
/* App version, top right; tap to check for updates */
.version {
  min-height: 44px; margin-right: -8px; padding: 0 8px;
  background: none; border: 0;
  font-size: .82rem; color: var(--muted);
}
.version:hover { color: var(--ink); }
.version[data-state="available"] { color: var(--accent); font-weight: 600; }
.status:hover { color: var(--ink); }
.status[data-state="stale"] { color: var(--warn); }
.status[data-state="error"] { color: var(--down); }

/* Update card (only inside the app, when a new version is published):
   icon + title, what's new, then two equal buttons or a progress bar. */
.update {
  display: grid; gap: 16px;
  padding: 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.update p { margin: 0; }
.update-head { display: flex; align-items: center; gap: 14px; }
.update-icon {
  flex: none; display: grid; place-items: center;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
}
.update-text { min-width: 0; }
.update-title { font-weight: 600; line-height: 1.3; }
.update-sub { font-size: .84rem; color: var(--muted); }
.update-new { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.update-label { font-size: .78rem; font-weight: 500; color: var(--muted); }
.update-notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .9rem; line-height: 1.4; }
.update-notes li { position: relative; padding-left: 16px; }
.update-notes li::before { content: ""; position: absolute; left: 3px; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.update-msg { font-size: .86rem; line-height: 1.45; color: var(--muted); }
.update-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.update-actions button {
  min-height: 46px; border-radius: 6px;
  font-size: .95rem; font-weight: 600;
}
.btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn-secondary:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.update-progress { display: flex; align-items: center; gap: 12px; min-height: 46px; }
.update-track { flex: 1; height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.update-track span { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width .2s; }
.update-pct { min-width: 3.2ch; text-align: right; font-size: .86rem; font-weight: 600; }

/* Conversion slip */
.slip { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.legs { position: relative; }
.leg {
  position: relative;
  display: flex; align-items: center; gap: 16px;
  min-height: 96px; padding: 18px 22px;
}
.leg + .leg { border-top: 1px solid var(--line); }
/* Currency pickers are plain text with a chevron: the code reads as the label. */
.pick {
  flex: none;
  max-width: 48%; min-height: 52px;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  margin: -4px -8px; padding: 4px 8px;
  background: none; border: 0; border-radius: 4px;
  text-align: left;
}
.pick:hover .code { color: var(--accent); }
.pick:active { background: var(--accent-soft); }
.pick .code {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 1.3rem; font-weight: 600; line-height: 1.2; letter-spacing: .01em;
}
.pick .code::after {
  content: ""; width: 6px; height: 6px; margin-top: -4px;
  border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
  transform: rotate(45deg);
}
.pick .name { max-width: 100%; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* The amount sizes to its text so the muted symbol can sit right beside it. */
.amount-wrap {
  flex: 1; min-width: 0;
  display: flex; justify-content: flex-end; align-items: baseline; gap: 6px;
  cursor: text;
}
.sym { flex: none; font-size: clamp(1.15rem, 5vw, 1.5rem); color: var(--faint); }
.sym:empty { display: none; }
.amount-wrap .amount { flex: 0 1 auto; min-width: 1ch; field-sizing: content; }
@supports not (field-sizing: content) {
  .sym { display: none; }
  .amount-wrap .amount { flex: 1; }
}
.amount {
  flex: 1; min-width: 0;
  padding: 4px 0;
  border: 0; background: transparent;
  font-size: clamp(1.9rem, 8vw, 2.6rem); font-weight: 500; line-height: 1.15; letter-spacing: -.02em;
  text-align: right;
  caret-color: var(--accent);
}
.amount:focus { outline: none; }
.amount::placeholder { color: var(--faint); }
.leg:focus-within { box-shadow: inset 2px 0 0 var(--accent); }
.calc {
  position: absolute; right: 22px; bottom: 8px;
  font-size: .8rem; color: var(--muted);
}

.swap {
  position: absolute; top: 50%; right: 22px; z-index: 2;
  width: 44px; height: 44px; margin-top: -22px;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 50%;
  color: var(--muted);
  transition: color .12s, border-color .12s;
}
.swap:hover { color: var(--accent); border-color: var(--accent); }

.rateline {
  display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap;
  padding: 4px 8px 4px 22px;
  border-top: 1px solid var(--line);
  font-size: .86rem;
}
.rate-main { color: var(--ink); }
.rate-main b { font-weight: 600; }
.rate-sub { color: var(--muted); }
.fee {
  margin-left: auto; position: relative;
  display: flex; align-items: center;
  color: var(--muted);
}
.fee select {
  appearance: none; -webkit-appearance: none;
  min-height: 44px; padding: 0 30px 0 12px;
  border: 0; border-radius: 4px; background: transparent;
  font-size: .86rem; color: inherit;
}
.fee select:hover { color: var(--ink); }
.fee select.on { color: var(--accent); font-weight: 600; }
.fee::after {
  content: ""; position: absolute; right: 14px; top: 50%; pointer-events: none;
  width: 5px; height: 5px; margin-top: -4px;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg);
}
.fee option { color: var(--ink); background: var(--surface); }

/* Sections */
.section { display: grid; gap: 10px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; margin-bottom: -6px; }
.section h2 { margin: 0; font-size: .95rem; font-weight: 600; line-height: 1.3; }
.change { margin-left: 8px; font-weight: 600; }
.change.up { color: var(--up); }
.change.down { color: var(--down); }

.range { display: flex; margin-right: -10px; }
.range button {
  min-width: 44px; min-height: 44px; padding: 0 10px;
  background: none; border: 0;
  font-size: .85rem; color: var(--muted);
}
.range button:hover { color: var(--ink); }
.range button[aria-pressed="true"] { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; text-decoration-color: var(--accent); }

.trend { position: relative; height: 116px; border-bottom: 1px solid var(--line); transition: opacity .2s; }
.trend.loading { opacity: .35; }
.trend svg { position: absolute; top: 0; bottom: 0; left: 0; right: 6px; width: calc(100% - 6px); height: 100%; overflow: visible; }
.trend .line { fill: none; stroke: var(--accent); stroke-width: 1.75; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.trend .end { position: absolute; left: calc(100% - 6px); width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--accent); }
.trend-axis { display: flex; justify-content: space-between; gap: 12px; font-size: .78rem; color: var(--muted); }
.trend-axis .mid { text-align: center; }
.trend-axis .mid.active { color: var(--ink); font-weight: 500; }
.trend { touch-action: pan-y; }
.trend .probe-line { position: absolute; top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: var(--muted); opacity: .5; pointer-events: none; }
.trend .probe-dot {
  position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--bg); pointer-events: none;
}
.empty { padding: 16px 0; font-size: .88rem; color: var(--muted); }

/* Also in: the amount in your other recent currencies */
.also { display: grid; }
.also button {
  display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; align-items: center; gap: 10px;
  min-height: 48px; padding: 0 2px;
  background: none; border: 0; border-top: 1px solid var(--line);
  text-align: left;
}
.also button:last-child { border-bottom: 1px solid var(--line); }
.also .c { font-weight: 600; letter-spacing: .01em; }
.also .n { font-size: .86rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.also .v { font-weight: 500; white-space: nowrap; }
.also button:hover .v { color: var(--accent); }
.also button:active { background: var(--accent-soft); }

/* Quick amounts */
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.quick-col { display: grid; min-width: 0; }
.quick-col h3 { margin: 0 0 4px; font-size: .8rem; font-weight: 500; color: var(--muted); }
.quick-col button {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 2px;
  background: none; border: 0; border-top: 1px solid var(--line);
  font-size: .9rem; text-align: left;
}
.quick-col button span:first-child { color: var(--muted); }
.quick-col button span:last-child { font-weight: 500; white-space: nowrap; }
.quick-col button:hover span:last-child { color: var(--accent); }
.quick-col button:active { background: var(--accent-soft); }
@media (max-width: 340px) { .quick { grid-template-columns: 1fr; } }


/* Operator keys above the phone keyboard (Android's number pad has none) */
.ops {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  gap: 6px;
  background: var(--surface); border-top: 1px solid var(--line);
}
.ops button {
  min-height: 44px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); font-size: 1.15rem; font-weight: 500;
}
.ops button:active { background: var(--accent-soft); }

/* Currency picker */
dialog {
  width: min(440px, calc(100vw - 32px));
  max-height: min(600px, calc(100dvh - 64px));
  padding: 0; border: 1px solid var(--line); border-radius: 4px;
  background: var(--surface); color: var(--ink);
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: var(--backdrop); }
.picker-head { display: flex; gap: 4px; padding: 10px 6px 10px 12px; border-bottom: 1px solid var(--line); }
.picker-head input {
  flex: 1; min-width: 0; min-height: 44px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
}
.picker-head input:focus { outline: none; border-color: var(--accent); }
.picker-head button { min-height: 44px; padding: 0 12px; border: 0; background: none; color: var(--muted); font-size: .9rem; }
.picker-head button:hover { color: var(--ink); }
.picker-list { list-style: none; margin: 0; padding: 4px 0 12px; overflow-y: auto; overscroll-behavior: contain; }
.picker-list .group { padding: 14px 16px 4px; font-size: .8rem; font-weight: 500; color: var(--muted); }
.picker-list button {
  width: 100%; min-height: 48px;
  display: grid; grid-template-columns: 48px 1fr 18px; align-items: center; gap: 10px;
  padding: 0 16px; border: 0; background: none; text-align: left;
}
.picker-list button:hover, .picker-list button:focus-visible { background: var(--accent-soft); outline: none; }
.picker-list button[aria-current="true"] { background: var(--accent-soft); }
.picker-list .c { font-weight: 600; letter-spacing: .01em; }
.picker-list .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picker-list .tick { color: var(--accent); }

@media (max-width: 520px) {
  body { padding-block: 12px 40px; }
  .leg { padding: 16px; gap: 12px; }
  .calc { right: 16px; }
  .swap { right: 16px; }
  .rateline { padding-left: 16px; }
  .rate-sub { flex-basis: 100%; order: 3; margin-top: -10px; padding-bottom: 8px; }
  dialog {
    width: 100%; max-width: none; height: 100dvh; max-height: 100dvh;
    margin: 0; border: 0; border-radius: 0;
  }
}
@media (max-width: 360px) { .rate-sub { display: none; } }
@media (prefers-reduced-motion: reduce) { .trend, .swap { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <h1 class="mark">Bureau</h1>
      <button class="status" id="status" data-state="loading" type="button" title="Refresh rates now">Loading rates…</button>
    </div>
    <button class="version" id="version" type="button" title="Check for updates" aria-live="polite" hidden></button>
  </header>

  <section class="update" id="updateCard" aria-label="App update" hidden>
    <div class="update-head">
      <span class="update-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v9M5 8.5 9 12.5l4-4M4 15h10"/></svg>
      </span>
      <div class="update-text">
        <p class="update-title" id="updateTitle">Update available</p>
        <p class="update-sub" id="updateSub"></p>
      </div>
    </div>
    <div class="update-new" id="updateNew">
      <p class="update-label">What's new</p>
      <ul class="update-notes" id="updateNotes"></ul>
    </div>
    <p class="update-msg" id="updateMsg" aria-live="polite" hidden></p>
    <div class="update-progress" id="updateProgress" hidden>
      <div class="update-track"><span id="updateBar"></span></div>
      <span class="update-pct" id="updatePct">0%</span>
    </div>
    <div class="update-actions" id="updateActions">
      <button class="btn-secondary" id="updateLater" type="button">Not now</button>
      <button class="btn-primary" id="updateGo" type="button">Update</button>
    </div>
  </section>

  <section class="slip" aria-label="Converter">
    <div class="legs">
      <div class="leg">
        <button class="pick" id="pickFrom" type="button" aria-haspopup="dialog">
          <span class="code" id="fromCode">USD</span><span class="name" id="fromName">US Dollar</span>
        </button>
        <div class="amount-wrap" id="fromWrap"><span class="sym" id="fromSym" aria-hidden="true"></span><input class="amount" id="fromAmount" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" spellcheck="false" placeholder="0"></div>
        <span class="calc" id="fromCalc" hidden></span>
      </div>
      <div class="leg">
        <button class="pick" id="pickTo" type="button" aria-haspopup="dialog">
          <span class="code" id="toCode">EUR</span><span class="name" id="toName">Euro</span>
        </button>
        <div class="amount-wrap" id="toWrap"><span class="sym" id="toSym" aria-hidden="true"></span><input class="amount" id="toAmount" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" spellcheck="false" placeholder="0"></div>
        <span class="calc" id="toCalc" hidden></span>
      </div>
      <button class="swap" id="swap" type="button" aria-label="Swap currencies">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2v11M2 10l3 3 3-3M11 14V3M8 6l3-3 3 3"/></svg>
      </button>
    </div>
    <div class="rateline">
      <span class="rate-main" id="rateMain">Waiting for rates</span>
      <span class="rate-sub" id="rateSub"></span>
      <label class="fee">
        <span class="sr-only">Bank or card fee</span>
        <select id="fee">
          <option value="0">No fee</option>
          <option value="0.5">0.5% fee</option>
          <option value="1">1% fee</option>
          <option value="1.5">1.5% fee</option>
          <option value="2">2% fee</option>
          <option value="2.5">2.5% fee</option>
          <option value="3">3% fee</option>
          <option value="4">4% fee</option>
          <option value="5">5% fee</option>
        </select>
      </label>
    </div>
    <p class="sr-only" id="announce" aria-live="polite"></p>
  </section>

  <section class="section" id="alsoSection" hidden>
    <div class="section-head"><h2>Also in</h2></div>
    <div class="also" id="also"></div>
  </section>

  <section class="section" id="trendSection">
    <div class="section-head">
      <h2>Trend<span class="change" id="trendChange"></span></h2>
      <div class="range" role="group" aria-label="Trend range" id="range">
        <button type="button" data-days="7" aria-pressed="false">1W</button>
        <button type="button" data-days="30" aria-pressed="true">1M</button>
        <button type="button" data-days="365" aria-pressed="false">1Y</button>
      </div>
    </div>
    <div class="trend" id="trend"></div>
    <div class="trend-axis" id="trendAxis"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Quick amounts</h2></div>
    <div class="quick" id="quick"></div>
  </section>

</main>

<div class="ops" id="ops" hidden>
  <button type="button" data-op="+" aria-label="Plus">+</button>
  <button type="button" data-op="−" aria-label="Minus">−</button>
  <button type="button" data-op="×" aria-label="Times">×</button>
  <button type="button" data-op="÷" aria-label="Divided by">÷</button>
</div>

<dialog id="picker" aria-label="Choose a currency">
  <div class="picker-head">
    <input id="pickerSearch" type="search" placeholder="Search by name or code" autocomplete="off" aria-label="Search currencies">
    <button type="button" id="pickerClose">Close</button>
  </div>
  <ul class="picker-list" id="pickerList"></ul>
</dialog>

<script src="lib.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const locale = navigator.language || 'en-US';
  const LIVE_URL = 'https://api.coinbase.com/v2/exchange-rates?currency=USD';
  const DAILY_URL = 'https://open.er-api.com/v6/latest/USD';
  const TREND_URL = 'https://api.frankfurter.dev/v1/';
  const REFRESH_MS = 60_000;
  const DAILY_REFRESH_MS = 60 * 60_000;
  const TREND_TTL_MS = 6 * 60 * 60_000;
  const FETCH_TIMEOUT_MS = 8000;

  const COMMON = ['USD', 'EUR', 'GBP', 'AUD', 'JPY', 'CAD', 'CHF', 'CNY', 'NZD', 'INR', 'SGD', 'HKD'];
  const { CRYPTO } = BureauLib;
  const EURO_ZONE = 'AT BE CY DE EE ES FI FR GR HR IE IT LT LU LV MT NL PT SI SK'.split(' ');
  const REGION_CURRENCY = {
    US: 'USD', GB: 'GBP', AU: 'AUD', NZ: 'NZD', CA: 'CAD', JP: 'JPY', CN: 'CNY', IN: 'INR', CH: 'CHF',
    SE: 'SEK', NO: 'NOK', DK: 'DKK', PL: 'PLN', CZ: 'CZK', HU: 'HUF', SG: 'SGD', HK: 'HKD', KR: 'KRW',
    ZA: 'ZAR', BR: 'BRL', MX: 'MXN', TR: 'TRY', IL: 'ILS', AE: 'AED', SA: 'SAR', TH: 'THB', ID: 'IDR',
    MY: 'MYR', PH: 'PHP', VN: 'VND', TW: 'TWD'
  };

  // Always Latin digits, so whatever we write into a field we can parse back.
  let fmtLocale = locale;
  try { fmtLocale = new Intl.Locale(locale, { numberingSystem: 'latn' }).toString(); } catch {}
  const sepParts = new Intl.NumberFormat(fmtLocale).formatToParts(12345.6);
  const GROUP = (sepParts.find(p => p.type === 'group') || { value: ',' }).value;

  let names = null;
  try { names = new Intl.DisplayNames([locale], { type: 'currency' }); } catch {}
  function nameOf(code) {
    if (CRYPTO[code]) return CRYPTO[code];
    try { return (names && names.of(code)) || code; } catch { return code; }
  }
  let SUPPORTED = null;
  try { SUPPORTED = new Set(Intl.supportedValuesOf('currency')); } catch {}
  const isFiat = code => /^[A-Z]{3}$/.test(code) && (SUPPORTED ? SUPPORTED.has(code) : nameOf(code) !== code);
  const isKnown = code => typeof code === 'string' && (CRYPTO[code] || /^[A-Z]{3}$/.test(code));

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('bureau.' + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('bureau.' + k, JSON.stringify(v)); } catch {} }
  };

  // ---- state ----
  let region = '';
  try { region = new Intl.Locale(locale).maximize().region || ''; } catch { region = (locale.split('-').pop() || '').toUpperCase(); }
  const home = EURO_ZONE.includes(region) ? 'EUR' : (REGION_CURRENCY[region] || 'USD');
  const saved = store.get('pair') || {};
  const state = {
    from: isKnown(saved.from) ? saved.from : home,
    to: isKnown(saved.to) ? saved.to : (home === 'USD' ? 'EUR' : 'USD'),
    edited: 'from',
    fee: Number(store.get('fee')) || 0,
    days: [7, 30, 365].includes(store.get('days')) ? store.get('days') : 30,
    recent: (store.get('recent') || []).filter(isKnown).slice(0, 5),
    rates: null,        // units per 1 USD
    updatedAt: 0,
    source: '',         // 'live' | 'daily'
    error: false
  };
  if (state.from === state.to) state.to = state.from === 'USD' ? 'EUR' : 'USD';
  let daily = store.get('daily');     // { rates, updatedAt, fetchedAt } from the backup source
  const cached = store.get('rates');
  if (cached && cached.rates && typeof cached.rates === 'object' && Object.keys(cached.rates).length) {
    Object.assign(state, { rates: cached.rates, updatedAt: cached.updatedAt || 0, source: cached.source === 'daily' ? 'daily' : 'live' });
  }

  // ---- numbers ----
  // Pure helpers live in lib.js (tested in CI); these bind them to this locale.
  const { fractionDigits, amountOpts } = BureauLib;
  const parseNumber = s => BureauLib.parseNumber(s, GROUP);
  const evaluate = text => BureauLib.evaluate(text, GROUP);
  const fmtAmount = (n, code) => Number.isFinite(n) ? new Intl.NumberFormat(fmtLocale, amountOpts(n, code)).format(n) : '';
  function fmtMoney(n, code, opts) {
    if (!Number.isFinite(n)) return '–';
    opts = opts || amountOpts(n, code);
    if (CRYPTO[code]) return new Intl.NumberFormat(fmtLocale, opts).format(n) + ' ' + code;
    try { return new Intl.NumberFormat(fmtLocale, { style: 'currency', currency: code, currencyDisplay: 'narrowSymbol', ...opts }).format(n); }
    catch { return new Intl.NumberFormat(fmtLocale, opts).format(n) + ' ' + code; }
  }
  const fmtRate = r => new Intl.NumberFormat(fmtLocale, r >= 100 ? { maximumFractionDigits: 2 } : { maximumSignificantDigits: 5 }).format(r);

  // ---- rates ----
  const rate = (from, to) => (state.rates && state.rates[from] > 0 && state.rates[to] > 0) ? state.rates[to] / state.rates[from] : NaN;
  const effectiveRate = (from, to) => rate(from, to) * (1 - state.fee / 100);

  async function getJSON(url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
      if (!res.ok) { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      return await res.json();
    } finally { clearTimeout(timer); }
  }
  async function fetchLive() {
    const json = await getJSON(LIVE_URL);
    const out = {};
    for (const [k, v] of Object.entries((json.data && json.data.rates) || {})) {
      const n = parseFloat(v);
      if (n > 0) out[k] = n;
    }
    if (!out.EUR) throw new Error('Live rates incomplete');
    out.USD = 1;
    return out;
  }
  async function fetchDaily() {
    const json = await getJSON(DAILY_URL);
    if (json.result !== 'success' || !json.rates || !json.rates.EUR) throw new Error('Daily rates unavailable');
    return { rates: json.rates, updatedAt: json.time_last_update_unix * 1000, fetchedAt: Date.now() };
  }
  const mergeRates = (live, ref) => BureauLib.mergeRates(live, ref, isFiat);

  let loading = false;
  async function loadRates() {
    if (loading) return;
    loading = true;
    const needDaily = !daily || Date.now() - (daily.fetchedAt || 0) > DAILY_REFRESH_MS;
    const [live, fresh] = await Promise.allSettled([fetchLive(), needDaily ? fetchDaily() : Promise.resolve(null)]);
    if (fresh.status === 'fulfilled' && fresh.value) { daily = fresh.value; store.set('daily', daily); }
    const ref = daily && daily.rates;
    if (live.status === 'fulfilled') {
      Object.assign(state, { rates: mergeRates(live.value, ref), updatedAt: Date.now(), source: 'live', error: false });
    } else if (fresh.status === 'fulfilled' && fresh.value) {
      Object.assign(state, { rates: mergeRates(null, ref), updatedAt: daily.updatedAt, source: 'daily', error: false });
    } else {
      state.error = true;
    }
    if (!state.error) store.set('rates', { rates: state.rates, updatedAt: state.updatedAt, source: state.source });
    loading = false;
    buildCurrencyList();
    renderAll();
    if (trendFailed) renderTrend();
  }

  // ---- currency list ----
  let currencies = [];
  function buildCurrencyList() {
    if (!state.rates) return;
    currencies = Object.keys(state.rates)
      .filter(c => CRYPTO[c] || isFiat(c))
      .sort((a, b) => nameOf(a).localeCompare(nameOf(b), locale));
  }
  buildCurrencyList();

  // ---- render ----
  // £, $, € and so on; nothing for crypto or where the symbol is just the code.
  function symbolOf(code) {
    if (CRYPTO[code]) return '';
    try {
      const part = new Intl.NumberFormat(fmtLocale, { style: 'currency', currency: code, currencyDisplay: 'narrowSymbol' })
        .formatToParts(1).find(p => p.type === 'currency');
      return part && part.value !== code ? part.value : '';
    } catch { return ''; }
  }

  function renderPair() {
    for (const side of ['from', 'to']) {
      const code = state[side];
      $(side + 'Code').textContent = code;
      $(side + 'Name').textContent = nameOf(code);
      $(side + 'Sym').textContent = symbolOf(code);
      $('pick' + (side === 'from' ? 'From' : 'To')).setAttribute('aria-label', `${side === 'from' ? 'You have' : 'You get'} ${nameOf(code)}. Change currency`);
      $(side + 'Amount').setAttribute('aria-label', `Amount in ${nameOf(code)}`);
    }
    document.title = `${state.from} → ${state.to} · Bureau`;
  }

  const field = side => $(side + 'Amount');
  const other = side => side === 'from' ? 'to' : 'from';

  // Writes only into the field you're not editing, so a refresh never touches what you type.
  function convert() {
    const src = state.edited, dst = other(src);
    const { value, isExpr } = evaluate(field(src).value);
    const hint = $(src + 'Calc');
    hint.hidden = !(isExpr && Number.isFinite(value) && value >= 0);
    if (!hint.hidden) hint.textContent = '= ' + fmtAmount(value, state[src]);
    $(dst + 'Calc').hidden = true;

    const r = effectiveRate(state.from, state.to);
    let out = NaN;
    if (Number.isFinite(value) && value >= 0 && Number.isFinite(r)) out = src === 'from' ? value * r : value / r;
    field(dst).value = fmtAmount(out, state[dst]);
    fitAll();
    store.set('amount', { side: src, value: field(src).value });
    announce();
    renderAlso();
  }

  // The "You have" amount in up to four other recently used currencies.
  function renderAlso() {
    const codes = state.recent.filter(c => c !== state.from && c !== state.to && state.rates && state.rates[c]).slice(0, 4);
    $('alsoSection').hidden = codes.length === 0;
    if (!codes.length) return;
    const amount = evaluate(field('from').value).value;
    const rows = codes.map(code => {
      const b = document.createElement('button');
      b.type = 'button';
      const r = effectiveRate(state.from, code);
      const value = Number.isFinite(amount) && amount >= 0 && Number.isFinite(r) ? fmtMoney(amount * r, code) : '–';
      for (const [cls, text] of [['c', code], ['n', nameOf(code)], ['v', value]]) {
        const s = document.createElement('span');
        s.className = cls;
        s.textContent = text;
        b.append(s);
      }
      b.setAttribute('aria-label', `${value} in ${nameOf(code)}. Convert to ${nameOf(code)}`);
      b.addEventListener('click', () => {
        const previous = state.to;
        state.to = code;
        state.recent = [previous, ...state.recent.filter(c => c !== previous)].slice(0, 5);
        store.set('recent', state.recent);
        state.edited = 'from';
        savePair();
        renderAll();
        renderTrend();
      });
      return b;
    });
    $('also').replaceChildren(...rows);
  }

  let announceTimer = 0;
  function announce() {
    clearTimeout(announceTimer);
    announceTimer = setTimeout(() => {
      const a = field('from').value, b = field('to').value;
      $('announce').textContent = a && b ? `${a} ${nameOf(state.from)} is ${b} ${nameOf(state.to)}` : '';
    }, 700);
  }

  // Long amounts shrink to fit instead of being cut off.
  function fit(input) {
    input.style.fontSize = '';
    let size = parseFloat(getComputedStyle(input).fontSize);
    while (input.scrollWidth > input.clientWidth && size > 15) {
      size *= 0.92;
      input.style.fontSize = size + 'px';
    }
  }
  const fitAll = () => { fit(field('from')); fit(field('to')); };

  function renderRateLine() {
    const r = rate(state.from, state.to);
    const main = $('rateMain'), sub = $('rateSub');
    if (!Number.isFinite(r)) {
      main.textContent = !state.rates ? (state.error ? 'No rates yet. Check your connection.' : 'Waiting for rates')
        : `No rate for ${state.from} → ${state.to}`;
      sub.textContent = '';
      return;
    }
    const eff = effectiveRate(state.from, state.to);
    main.innerHTML = `1 ${state.from} = <b>${fmtRate(eff)}</b> ${state.to}`;
    sub.textContent = state.fee ? `Mid-market ${fmtRate(r)}` : `1 ${state.to} = ${fmtRate(1 / r)} ${state.from}`;
    $('fee').value = String(state.fee);
    $('fee').classList.toggle('on', state.fee > 0);
  }

  function agoText(ms) {
    const age = Date.now() - ms;
    if (age < 60_000) return 'just now';
    if (age < 3_600_000) return Math.floor(age / 60_000) + ' min ago';
    if (age < 86_400_000) return Math.floor(age / 3_600_000) + ' h ago';
    return new Date(ms).toLocaleDateString(locale, { day: 'numeric', month: 'short' });
  }
  function renderStatus() {
    const el = $('status');
    if (!state.rates) {
      el.dataset.state = state.error ? 'error' : 'loading';
      el.textContent = state.error ? "Can't reach rates · Retry" : 'Loading rates…';
      return;
    }
    if (state.error) { el.dataset.state = 'error'; el.textContent = `Offline · rates from ${agoText(state.updatedAt)}`; }
    else if (state.source === 'daily') { el.dataset.state = 'stale'; el.textContent = `Daily rates · ${agoText(state.updatedAt)}`; }
    else if (Date.now() - state.updatedAt > 3 * 60_000) { el.dataset.state = 'stale'; el.textContent = `Updated ${agoText(state.updatedAt)}`; }
    else { el.dataset.state = 'live'; el.textContent = `Updated ${agoText(state.updatedAt)}`; }
  }

  // ---- quick amounts ----
  function quickAmounts(code) {
    const usdValue = state.rates && state.rates[code] ? 1 / state.rates[code] : 1;
    const k = Math.round(Math.log10(usdValue));
    const mult = Math.abs(k) >= 2 ? Math.pow(10, -k) : 1;
    return [1, 5, 10, 20, 50, 100, 200, 500, 1000].map(a => a * mult);
  }
  function quickColumn(from, to) {
    const col = document.createElement('div');
    col.className = 'quick-col';
    const h = document.createElement('h3');
    h.textContent = `${from} → ${to}`;
    col.append(h);
    const r = effectiveRate(from, to);
    for (const a of quickAmounts(from)) {
      const b = document.createElement('button');
      b.type = 'button';
      const left = document.createElement('span');
      left.textContent = fmtMoney(a, from, Number.isInteger(a) ? { maximumFractionDigits: 0 } : undefined);
      const right = document.createElement('span');
      right.textContent = Number.isFinite(r) ? fmtMoney(a * r, to) : '–';
      b.append(left, right);
      b.setAttribute('aria-label', `Use ${left.textContent}, ${right.textContent}`);
      b.addEventListener('click', () => {
        if (from !== state.from) swap();
        state.edited = 'from';
        field('from').value = fmtAmount(a, state.from);
        convert();
      });
      col.append(b);
    }
    return col;
  }
  function renderQuick() {
    $('quick').replaceChildren(quickColumn(state.from, state.to), quickColumn(state.to, state.from));
  }

  // ---- trend (ECB reference rates, fiat only) ----
  // Trend series are kept on the device (the last few pairs and ranges), so
  // the chart draws at once on launch and refreshes quietly behind it.
  const trendCache = new Map(Object.entries(store.get('trend') || {}).filter(([, e]) => e && Array.isArray(e.series)));
  function saveTrend(key, entry) {
    trendCache.delete(key);
    trendCache.set(key, entry);
    while (trendCache.size > 8) trendCache.delete(trendCache.keys().next().value);
    store.set('trend', Object.fromEntries(trendCache));
  }
  let trendToken = 0;
  let trendFailed = false;
  function renderRange() {
    for (const b of $('range').querySelectorAll('button')) b.setAttribute('aria-pressed', String(Number(b.dataset.days) === state.days));
  }
  async function renderTrend() {
    const token = ++trendToken;
    const { from, to, days } = state;
    renderRange();
    if (CRYPTO[from] || CRYPTO[to]) return showTrendEmpty('The ECB only publishes rates for national currencies, so there is no trend for crypto.');
    const key = `${from}${to}${days}`;
    let entry = trendCache.get(key);
    if (entry && entry.series.length >= 2) drawTrend(entry.series);
    if (!entry || Date.now() - entry.at > TREND_TTL_MS) {
      if (!entry) $('trend').classList.add('loading');
      const end = new Date(), start = new Date(end - (days + 1) * 864e5);
      try {
        const json = await getJSON(`${TREND_URL}${start.toISOString().slice(0, 10)}..?base=${from}&symbols=${to}`);
        const series = Object.entries(json.rates || {}).map(([d, v]) => [d, v[to]]).filter(p => Number.isFinite(p[1]));
        entry = { at: Date.now(), series };
        saveTrend(key, entry);
      } catch (e) {
        if (token !== trendToken) return;
        const noData = e.status === 404 || e.status === 422;
        trendFailed = !noData;
        if (entry && !noData) return; // keep showing the saved chart
        return showTrendEmpty(noData
          ? `The ECB doesn't publish reference rates for ${from} → ${to}.`
          : "Couldn't load the trend. It will try again with the next rate update.");
      }
      if (token !== trendToken) return;
      trendFailed = false;
      if (entry.series.length < 2) return showTrendEmpty(`The ECB doesn't publish reference rates for ${from} → ${to}.`);
      drawTrend(entry.series);
    } else if (entry.series.length < 2) {
      showTrendEmpty(`The ECB doesn't publish reference rates for ${from} → ${to}.`);
    }
  }
  function drawTrend(series) {
    const el = $('trend');
    el.classList.remove('loading');
    const vals = series.map(p => p[1]);
    const min = Math.min(...vals), max = Math.max(...vals);
    const span = max - min || max * 0.001;
    const W = 300, H = 116, pad = 10;
    const x = i => (i / (vals.length - 1)) * W;
    const y = v => pad + (1 - (v - min) / span) * (H - pad * 2);
    const line = 'M' + vals.map((v, i) => `${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' L');
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <path class="line" d="${line}"/>
      </svg><span class="end" style="top:${(y(vals.at(-1)) / H * 100).toFixed(2)}%"></span>
      <span class="probe-line" hidden></span><span class="probe-dot" hidden></span>`;
    const change = (vals.at(-1) / vals[0] - 1) * 100;
    const changeEl = $('trendChange');
    changeEl.className = 'change ' + (change >= 0 ? 'up' : 'down');
    changeEl.textContent = `${change >= 0 ? '+' : '−'}${Math.abs(change).toFixed(2)}%`;
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', `${state.from} to ${state.to}: ${fmtRate(vals[0])} to ${fmtRate(vals.at(-1))}, low ${fmtRate(min)}, high ${fmtRate(max)}`);
    const long = state.days > 60;
    const d = s => new Date(s + 'T00:00:00').toLocaleDateString(locale, long ? { month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' });
    $('trendAxis').innerHTML = '';
    for (const [cls, text] of [['', d(series[0][0])], ['mid', `Low ${fmtRate(min)} · High ${fmtRate(max)}`], ['', d(series.at(-1)[0])]]) {
      const s = document.createElement('span');
      if (cls) s.className = cls;
      s.textContent = text;
      $('trendAxis').append(s);
    }
    scrub = { series, y, H, rest: `Low ${fmtRate(min)} · High ${fmtRate(max)}` };
  }

  // Touch or hover the chart to read the rate on a given day. The reading
  // replaces the low/high line under the chart until you let go.
  let scrub = null;
  function scrubAt(clientX) {
    const el = $('trend');
    if (!scrub || !el.querySelector('svg')) return;
    const rect = el.getBoundingClientRect();
    const width = rect.width - 6;
    const n = scrub.series.length;
    const i = Math.round(Math.max(0, Math.min(1, (clientX - rect.left) / width)) * (n - 1));
    const [date, value] = scrub.series[i];
    const left = (i / (n - 1)) * width;
    const top = scrub.y(value) / scrub.H * 100;
    const lineEl = el.querySelector('.probe-line'), dot = el.querySelector('.probe-dot');
    lineEl.hidden = dot.hidden = false;
    lineEl.style.left = left + 'px';
    dot.style.left = left + 'px';
    dot.style.top = top + '%';
    const mid = $('trendAxis').querySelector('.mid');
    if (mid) {
      mid.classList.add('active');
      const day = new Date(date + 'T00:00:00').toLocaleDateString(locale, { day: 'numeric', month: 'short', year: state.days > 60 ? 'numeric' : undefined });
      mid.textContent = `${day} · ${fmtRate(value)}`;
    }
  }
  function endScrub() {
    const el = $('trend');
    el.querySelectorAll('.probe-line, .probe-dot').forEach(p => { p.hidden = true; });
    const mid = $('trendAxis').querySelector('.mid');
    if (mid && scrub) { mid.classList.remove('active'); mid.textContent = scrub.rest; }
  }
  $('trend').addEventListener('pointerdown', e => scrubAt(e.clientX));
  $('trend').addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) scrubAt(e.clientX); });
  for (const type of ['pointerup', 'pointerleave', 'pointercancel']) $('trend').addEventListener(type, endScrub);

  function showTrendEmpty(msg) {
    scrub = null;
    const el = $('trend');
    el.classList.remove('loading');
    el.removeAttribute('role');
    el.removeAttribute('aria-label');
    el.innerHTML = '<div class="empty"></div>';
    el.firstChild.textContent = msg;
    $('trendChange').textContent = '';
    $('trendAxis').innerHTML = '';
  }

  function renderAll() {
    renderPair();
    convert();
    renderRateLine();
    renderStatus();
    renderQuick();
    tellAppPair();
  }

  // ---- Android app bridge (absent in a browser) ----
  // The app injects window.bureauApp for its own origin only. It uses the pair
  // for the home-screen widget, the picker state for the Back gesture, and
  // answers with its version and update checks.
  const app = window.bureauApp || null;
  function toApp(msg) {
    if (!app) return;
    try { app.postMessage(JSON.stringify(msg)); } catch {}
  }
  let pairTimer = 0;
  function tellAppPair() {
    if (!app) return;
    clearTimeout(pairTimer);
    pairTimer = setTimeout(() => {
      const r = rate(state.from, state.to);
      if (Number.isFinite(r)) toApp({ type: 'pair', from: state.from, to: state.to, fee: state.fee, rate: r, updatedAt: state.updatedAt });
    }, 400);
  }
  if (app) {
    app.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'info') {
        appVersion = m.version;
        $('version').hidden = false;
        if (!updateReady) showVersion(`v${appVersion}`);
      } else if (m.type === 'updateStatus') {
        if (m.state === 'available') return markUpdateReady();
        showVersion(m.state === 'latest' ? 'Up to date' : "Couldn't check");
        versionTimer = setTimeout(() => showVersion(`v${appVersion}`), 2500);
      } else if (m.type === 'update') {
        if (m.state === 'available') markUpdateReady();
        showUpdate(m);
      }
    };
    $('updateGo').addEventListener('click', () => {
      showUpdate({ state: 'downloading', progress: 0 });
      toApp({ type: 'installUpdate' });
    });
    $('updateLater').addEventListener('click', () => { $('updateCard').hidden = true; });
    // Tapping the version checks for updates; once one is known it reopens the card.
    $('version').addEventListener('click', () => {
      if (updateReady && $('updateCard').hidden) {
        $('updateCard').hidden = false;
        scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      if (updateReady) return;
      showVersion('Checking…');
      toApp({ type: 'checkUpdate' });
    });
  }

  // ---- version, top right ----
  let appVersion = '', updateReady = false, versionTimer = 0;
  function showVersion(text, state) {
    clearTimeout(versionTimer);
    $('version').textContent = text;
    $('version').dataset.state = state || '';
  }
  function markUpdateReady() {
    updateReady = true;
    showVersion('Update available', 'available');
  }

  // The update card. The app sends: available (version, notes, size),
  // downloading (progress 0..1), installing, and failed (message).
  let updateVersion = '', updateSize = 0;
  function showUpdate(m) {
    const show = (id, on) => { $(id).hidden = !on; };
    $('updateCard').hidden = false;
    if (m.state === 'available') {
      updateVersion = m.version || updateVersion;
      updateSize = m.size > 0 ? m.size : updateSize;
      const notes = Array.isArray(m.notes) ? m.notes.filter(n => typeof n === 'string' && n).slice(0, 5) : [];
      $('updateNotes').replaceChildren(...notes.map(n => { const li = document.createElement('li'); li.textContent = n; return li; }));
      show('updateNew', notes.length > 0);
    }
    const sub = [`Bureau ${updateVersion}`, updateSize ? `${(updateSize / 1e6).toFixed(1)} MB` : ''].filter(Boolean).join(' · ');
    const pct = Math.round(Math.max(0, Math.min(1, m.progress || 0)) * 100);
    const view = {
      available: { title: 'Update available', msg: '', actions: true, progress: false, go: 'Update' },
      downloading: { title: 'Downloading update', msg: '', actions: false, progress: true },
      installing: { title: 'Installing update', actions: false, progress: true,
        msg: 'Confirm on the next screen. The first time, Android asks you to allow installs from Bureau. Turn it on, then go back.' },
      failed: { title: "Update didn't finish", msg: m.message || 'Something went wrong. Try again.', actions: true, progress: false, go: 'Try again' },
    }[m.state];
    if (!view) return;
    $('updateTitle').textContent = view.title;
    $('updateSub').textContent = sub;
    $('updateMsg').textContent = view.msg;
    show('updateMsg', !!view.msg);
    show('updateActions', view.actions);
    show('updateProgress', view.progress);
    if (view.go) $('updateGo').textContent = view.go;
    if (view.progress) {
      const p = m.state === 'installing' ? 100 : pct;
      $('updateBar').style.width = p + '%';
      $('updatePct').textContent = p + '%';
    }
  }

  // Rates bundled into the app at release time, so a first launch with no
  // signal still converts. Missing in the browser build, which is fine.
  async function loadSnapshot() {
    if (state.rates) return;
    try {
      const json = await getJSON('snapshot.json');
      if (json.result !== 'success' || !json.rates || !json.rates.EUR || state.rates) return;
      const snap = { rates: json.rates, updatedAt: json.time_last_update_unix * 1000, fetchedAt: 0 };
      if (!daily) daily = snap;
      Object.assign(state, { rates: mergeRates(null, snap.rates), updatedAt: snap.updatedAt, source: 'daily' });
      buildCurrencyList();
      renderAll();
    } catch {}
  }

  // ---- interactions ----
  for (const side of ['from', 'to']) {
    const input = field(side);
    // The input is only as wide as its text, so a tap anywhere in the amount area focuses it.
    $(side + 'Wrap').addEventListener('click', e => { if (e.target !== input) input.focus(); });
    input.addEventListener('focus', () => {
      state.edited = side;
      input.select();
      showOps(true);
    });
    input.addEventListener('input', () => { state.edited = side; convert(); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
    input.addEventListener('blur', () => {
      showOps(false);
      // Tidy what was typed (grouping, or the result of a sum) without rounding it.
      const { value } = evaluate(input.value);
      if (Number.isFinite(value) && value >= 0) {
        const d = fractionDigits(state[side]);
        input.value = new Intl.NumberFormat(fmtLocale, { minimumFractionDigits: d, maximumFractionDigits: Math.max(d, 8) }).format(value);
        convert();
      }
    });
  }

  // Operator keys: only on touch screens, only while an amount is being edited.
  const coarse = matchMedia('(pointer: coarse)');
  let opsTimer = 0;
  function showOps(on) {
    clearTimeout(opsTimer);
    if (on) { if (coarse.matches) $('ops').hidden = false; }
    else opsTimer = setTimeout(() => { $('ops').hidden = true; }, 120);
  }
  $('ops').addEventListener('pointerdown', e => e.preventDefault());   // keep the keyboard up
  $('ops').addEventListener('click', e => {
    const b = e.target.closest('button[data-op]');
    if (!b) return;
    const input = field(state.edited);
    if (document.activeElement !== input) input.focus();
    const start = input.selectionStart ?? input.value.length, end = input.selectionEnd ?? input.value.length;
    input.setRangeText(b.dataset.op, start, end, 'end');
    input.dispatchEvent(new Event('input'));
  });

  function savePair() {
    store.set('pair', { from: state.from, to: state.to });
  }
  function swap() {
    [state.from, state.to] = [state.to, state.from];
    const f = field('from').value;
    field('from').value = field('to').value;
    field('to').value = f;
    state.edited = other(state.edited);
    savePair();
    renderAll();
    renderTrend();
    slideLegs();
  }
  // The two rows trade places: each slides in from where the other was.
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  function slideLegs() {
    if (reduceMotion.matches || !Element.prototype.animate) return;
    const legs = document.querySelectorAll('.leg');
    const shift = legs[0].offsetHeight * 0.35;
    legs.forEach((leg, i) => {
      const from = i === 0 ? shift : -shift;
      for (const el of leg.querySelectorAll('.pick, .amount-wrap')) {
        el.animate(
          [{ transform: `translateY(${from}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }],
          { duration: 220, easing: 'cubic-bezier(.2, .7, .2, 1)' },
        );
      }
    });
  }
  $('swap').addEventListener('click', swap);
  $('status').addEventListener('click', () => {
    if (loading) return;
    const el = $('status');
    el.dataset.state = 'loading';
    el.textContent = 'Updating…';
    loadRates();
  });
  $('fee').addEventListener('change', e => {
    state.fee = Number(e.target.value) || 0;
    store.set('fee', state.fee);
    renderAll();
  });
  $('range').addEventListener('click', e => {
    const b = e.target.closest('button[data-days]');
    if (!b) return;
    state.days = Number(b.dataset.days);
    store.set('days', state.days);
    renderTrend();
  });

  // ---- picker ----
  const dlg = $('picker');
  let pickingSide = 'from';
  function openPicker(side) {
    pickingSide = side;
    $('pickerSearch').value = '';
    renderPickerList('');
    dlg.showModal();
    $('pickerSearch').focus();
    toApp({ type: 'picker', open: true });
  }
  dlg.addEventListener('close', () => toApp({ type: 'picker', open: false }));
  function itemButton(code) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.code = code;
    const current = code === state[pickingSide];
    if (current) b.setAttribute('aria-current', 'true');
    const c = document.createElement('span'); c.className = 'c'; c.textContent = code;
    const n = document.createElement('span'); n.className = 'n'; n.textContent = nameOf(code);
    const t = document.createElement('span'); t.className = 'tick'; t.setAttribute('aria-hidden', 'true'); t.textContent = current ? '✓' : '';
    b.append(c, n, t);
    li.append(b);
    return li;
  }
  function group(label, codes) {
    if (!codes.length) return [];
    const li = document.createElement('li');
    li.className = 'group';
    li.textContent = label;
    return [li, ...codes.map(itemButton)];
  }
  function renderPickerList(q) {
    const list = $('pickerList');
    const all = currencies.length ? currencies : COMMON;
    q = q.trim().toLowerCase();
    if (!q) {
      const recent = state.recent.filter(c => all.includes(c));
      const common = COMMON.filter(c => all.includes(c) && !recent.includes(c));
      const crypto = Object.keys(CRYPTO).filter(c => all.includes(c) && !recent.includes(c));
      const rest = currencies.filter(c => !CRYPTO[c]);
      list.replaceChildren(
        ...group('Recent', recent),
        ...group('Common', common),
        ...group('Crypto', crypto),
        ...group('All currencies', rest)
      );
      return;
    }
    const hits = all
      .map(c => {
        const name = nameOf(c).toLowerCase(), code = c.toLowerCase();
        const score = code === q ? 0 : code.startsWith(q) ? 1 : name.startsWith(q) ? 2 : name.includes(q) ? 3 : -1;
        return [c, score];
      })
      .filter(([, s]) => s >= 0)
      .sort((a, b) => a[1] - b[1]);
    if (!hits.length) {
      const li = document.createElement('li');
      li.className = 'group';
      li.textContent = `Nothing matches “${q}”`;
      list.replaceChildren(li);
      return;
    }
    list.replaceChildren(...hits.map(([c]) => itemButton(c)));
  }
  function choose(code) {
    const otherSide = other(pickingSide);
    if (code === state[otherSide]) state[otherSide] = state[pickingSide];
    state[pickingSide] = code;
    state.recent = [code, ...state.recent.filter(c => c !== code)].slice(0, 5);
    store.set('recent', state.recent);
    savePair();
    dlg.close();
    renderAll();
    renderTrend();
  }
  $('pickFrom').addEventListener('click', () => openPicker('from'));
  $('pickTo').addEventListener('click', () => openPicker('to'));
  $('pickerClose').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => {
    if (e.target === dlg) return dlg.close();
    const b = e.target.closest('button[data-code]');
    if (b) choose(b.dataset.code);
  });
  $('pickerSearch').addEventListener('input', e => renderPickerList(e.target.value));
  $('pickerSearch').addEventListener('keydown', e => {
    const first = $('pickerList').querySelector('button[data-code]');
    if (e.key === 'Enter' && first) { e.preventDefault(); choose(first.dataset.code); }
    if (e.key === 'ArrowDown' && first) { e.preventDefault(); first.focus(); }
  });
  $('pickerList').addEventListener('keydown', e => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const btns = [...$('pickerList').querySelectorAll('button[data-code]')];
    const i = btns.indexOf(document.activeElement);
    const next = e.key === 'ArrowDown' ? btns[i + 1] : (i <= 0 ? $('pickerSearch') : btns[i - 1]);
    if (next) next.focus();
  });

  // ---- boot ----
  const savedAmount = store.get('amount');
  if (savedAmount && typeof savedAmount.value === 'string' && savedAmount.value) {
    state.edited = savedAmount.side === 'to' ? 'to' : 'from';
    field(state.edited).value = savedAmount.value;
  } else {
    field('from').value = fmtAmount(100, state.from);
  }
  renderAll();
  renderTrend();
  toApp({ type: 'hello' });
  loadSnapshot();
  loadRates();
  setInterval(() => { if (!document.hidden) loadRates(); }, REFRESH_MS);
  setInterval(renderStatus, 15_000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - state.updatedAt > REFRESH_MS) loadRates();
  });
  addEventListener('online', loadRates);
  addEventListener('resize', fitAll);
  if (document.fonts) document.fonts.ready.then(fitAll);
})();
</script>
</body>
</html>
