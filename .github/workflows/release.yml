name: Build & Release APK

# Pushing a v* tag builds a signed APK, attaches it to a release here, and
# publishes it with latest.json to the public bureau-releases repo, which is
# where installed apps look for updates (this repo is private, so phones
# can't read its releases).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/bureau-release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/bureau-release.keystore" >> "$GITHUB_ENV"
          # Fail early if the keystore didn't materialize. keytool reports
          # errors on stdout, so capture everything and print on failure.
          if ! keytool -list -keystore "$RUNNER_TEMP/bureau-release.keystore" \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > "$RUNNER_TEMP/keytool.log" 2>&1; then
            echo "Keystore verification failed:"
            cat "$RUNNER_TEMP/keytool.log"
            exit 1
          fi

      - name: Derive version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VN="${GITHUB_REF_NAME#v}"
            echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
            # Monotonic versionCode from the dotted version: major*10000 + minor*100 + patch.
            IFS='.' read -r MA MI PA <<< "$VN"
            echo "VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"
          fi

      - name: Bundle a rates snapshot for offline first launch
        run: |
          # Best effort: the page works without it, it just needs a signal on first open.
          if ! curl -sf --max-time 20 https://open.er-api.com/v6/latest/USD -o web/snapshot.json \
              || ! grep -q '"result":"success"' web/snapshot.json; then
            rm -f web/snapshot.json
          fi

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease

      - name: Name the artifact
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="manual-${GITHUB_SHA::7}"; fi
          cp app/build/outputs/apk/release/app-release.apk "Bureau-${VERSION}.apk"
          echo "APK_NAME=Bureau-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true

      - name: Publish to bureau-releases (what installed apps check)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DEPLOY_KEY: ${{ secrets.RELEASES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          RAW="https://raw.githubusercontent.com/matisseduffield/bureau-releases/main"
          mkdir pub && cp "$APK_NAME" pub/
          cd pub
          SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK_NAME")
          cat > latest.json <<JSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apk": "$RAW/$APK_NAME",
            "size": $SIZE,
            "sha256": "$SHA",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat > README.md <<MD
          # Bureau releases

          Signed Android builds of Bureau, a live currency converter. Only the
          newest build is kept here; installed copies update themselves from it.

          Latest: **$VERSION_NAME** · [$APK_NAME]($RAW/$APK_NAME)
          MD

          # One orphan commit, force-pushed, so old APKs don't pile up in history.
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Bureau $VERSION_NAME"
          git push --force git@github.com:matisseduffield/bureau-releases.git main
